[package]
name = "ifol-gpu"
version = "0.1.0"
edition = "2024"

[features]
default = ["image-encode"]
image-encode = ["dep:image"]

[dependencies]
bytemuck = "1.25.2"
log = "0.4.33"
pollster = "1.0.1"
thiserror = "2.0.20"
wgpu = "30.0.0"
winit = { version = "0.30.13", features = ["rwh_06"] }
image = { version = "0.24.9", optional = true }

[dev-dependencies]
pollster = "1.0.1"
env_logger = "0.10.0"
criterion = "0.5.1"
log = "0.4.33"
serde_json = "1.0"

